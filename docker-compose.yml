# Dữ liệu nặng nằm NGOÀI Docker và ngoài repo (mặc định ../video-aff-data, đổi bằng VIDEO_AFF_DATA trong .env):
#   media/   ảnh, clip, video, âm thanh (storage/app/public của Laravel)
#   mysql/   dữ liệu MySQL
#   backups/ bản sao lưu mysqldump
# Docker hỏng / hết dung lượng cấp cho Docker / xoá volume thì dữ liệu vẫn còn trên ổ máy.
x-php: &php
  image: video-aff-php
  volumes:
    - ./:/var/www/html
    - ${VIDEO_AFF_DATA:-../video-aff-data}/media:/var/www/html/storage/app/public
    - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
  environment:
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-video_aff}
    DB_USERNAME: ${DB_USERNAME:-video_aff}
    DB_PASSWORD: ${DB_PASSWORD:-secret}
    MUSE_BROWSER_URL: http://browser:3000
    AUDIO_ANALYZER_URL: http://audio:3100
    EXPRESSIVE_TTS_URL: http://expressive:3200
  depends_on:
    db:
      condition: service_healthy
  networks:
    - internal

services:
  app:
    <<: *php
    container_name: video-aff-app
    restart: unless-stopped
    # Chỉ app build image; queue dùng lại image này (build cả hai cùng lúc sẽ bị trùng tên image)
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}

  # Chạy các job nền (tạo ảnh, ghép video)
  queue:
    <<: *php
    container_name: video-aff-queue
    restart: unless-stopped
    pull_policy: never
    # Kết quả clip từ muse.ai về dạng base64 (vài MB, giải mã ra vài chục MB): 128M mặc định không đủ, worker bị tràn bộ nhớ.
    command: php -d memory_limit=1G artisan queue:work --queue=default,images --timeout=900 --memory=512

  # Worker riêng cho ảnh Muse: chỉ gửi yêu cầu và hỏi kết quả (nhanh), không phải chờ sau job Claude / dựng video dài.
  queue-images:
    <<: *php
    container_name: video-aff-queue-images
    restart: unless-stopped
    pull_policy: never
    command: php -d memory_limit=1G artisan queue:work --queue=images --timeout=900 --memory=512

  nginx:
    container_name: video-aff-nginx
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ${VIDEO_AFF_DATA:-../video-aff-data}/media:/var/www/html/storage/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - internal

  db:
    container_name: video-aff-db
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-video_aff}
      MYSQL_USER: ${DB_USERNAME:-video_aff}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - ${VIDEO_AFF_DATA:-../video-aff-data}/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  # Trình duyệt ngầm (Playwright) đăng nhập muse.ai bằng tài khoản của bạn và gửi lệnh tạo ảnh.
  # Không mở cổng ra ngoài; chỉ app/queue gọi được qua mạng nội bộ.
  browser:
    container_name: video-aff-browser
    image: video-aff-browser
    build:
      context: ./docker/browser
    restart: unless-stopped
    environment:
      BROWSER_TOKEN: ${MUSE_BROWSER_TOKEN:-}
    volumes:
      # Phiên đăng nhập muse.ai (cookie) giữ qua các lần khởi động lại.
      - browser-data:/data
    shm_size: 1gb
    networks:
      - internal

  # Phân tích nhạc cho hát nhép: Demucs tách giọng hát + faster-whisper ghi lời (CPU). Chỉ mạng nội bộ.
  audio:
    container_name: video-aff-audio
    image: video-aff-audio
    build:
      context: ./docker/audio
    restart: unless-stopped
    environment:
      AUDIO_TOKEN: ${AUDIO_ANALYZER_TOKEN:-}
    networks:
      - internal

  # Giọng đọc biểu cảm (Chatterbox, MIT) cho phim hoạt hình, CPU. Nạp mô hình (~4 GB RAM) khi có việc, rảnh 10 phút thì giải phóng.
  # Cần Docker Desktop cấp khoảng 10–12 GB RAM. Chỉ mạng nội bộ.
  expressive:
    container_name: video-aff-expressive
    image: video-aff-expressive
    build:
      context: ./docker/expressive
    restart: unless-stopped
    environment:
      AUDIO_TOKEN: ${AUDIO_ANALYZER_TOKEN:-}
    networks:
      - internal

  # Vite dev server (hot reload cho React)
  node:
    container_name: video-aff-node
    image: node:22-alpine
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      # node_modules riêng cho Linux, không ghi đè bản của máy host (macOS)
      - node-modules:/var/www/html/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    networks:
      - internal

volumes:
  # Volume MySQL cũ (trước khi chuyển sang video-aff-data/mysql), giữ lại làm bản dự phòng; không còn dùng.
  mysql-data:
  browser-data:
  node-modules:

networks:
  internal:
    driver: bridge
