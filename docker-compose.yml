x-php: &php
  image: video-aff-php
  volumes:
    - ./:/var/www/html
  environment:
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-video_aff}
    DB_USERNAME: ${DB_USERNAME:-video_aff}
    DB_PASSWORD: ${DB_PASSWORD:-secret}
  depends_on:
    db:
      condition: service_healthy
  networks:
    - internal

services:
  app:
    <<: *php
    container_name: video-aff-app
    restart: unless-stopped
    # Chỉ app build image; queue dùng lại image này (build cả hai cùng lúc sẽ bị trùng tên image)
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}

  # Chạy các job nền (tạo ảnh, ghép video)
  queue:
    <<: *php
    container_name: video-aff-queue
    restart: unless-stopped
    pull_policy: never
    command: php artisan queue:work --timeout=900

  nginx:
    container_name: video-aff-nginx
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - internal

  db:
    container_name: video-aff-db
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-video_aff}
      MYSQL_USER: ${DB_USERNAME:-video_aff}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  # Vite dev server (hot reload cho React)
  node:
    container_name: video-aff-node
    image: node:22-alpine
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      # node_modules riêng cho Linux, không ghi đè bản của máy host (macOS)
      - node-modules:/var/www/html/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    networks:
      - internal

volumes:
  mysql-data:
  node-modules:

networks:
  internal:
    driver: bridge
